<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>装修预算账本</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2E4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="装修账本">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F5F2EB; --card:#FFFFFF; --ink:#23271F; --ink2:#5E6358; --ink3:#90948A;
    --line:#E6E1D5; --line-soft:#F1EEE7; --green:#2E4A3B; --green2:#41654F; --green-soft:#EAEEE8;
    --orange:#CF6B3F; --orange-soft:#FBEEE5; --red:#B4462F; --amber:#A8791A;
    --radius:20px; --radius-sm:14px;
    --shadow:0 1px 2px rgba(40,40,30,.04),0 8px 24px rgba(40,40,30,.05);
  }
  html{font-size:16.5px}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:.94rem/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:1120px;margin:0 auto;padding:2.2rem 1.5rem 6rem}

  /* ---------- header ---------- */
  .top{border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:1.4rem}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}
  h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:2.45rem;line-height:1.12;
     letter-spacing:-.01em;margin:0 0 .45rem}
  .sub{color:var(--ink2);font-size:.82rem}
  .top-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.6rem 1.05rem;
        font-size:.82rem;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink);
        transition:border-color .16s,box-shadow .16s,transform .1s}
  .pill:hover{border-color:#CFC9B9;box-shadow:var(--shadow)}
  .pill:active{transform:scale(.98)}
  .pill b{font-variant-numeric:tabular-nums;font-weight:600}

  /* 字号 */
  .fs{display:flex;align-items:center;gap:.25rem;border:1px solid var(--line);background:#fff;
      border-radius:99px;padding:.25rem .3rem}
  .fs button{border:none;background:transparent;font-family:inherit;font-size:.78rem;color:var(--ink2);
      padding:.35rem .6rem;border-radius:99px;cursor:pointer;line-height:1}
  .fs button.on{background:var(--green);color:#fff}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:.45rem;margin-bottom:1.35rem;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.58rem 1.25rem;
       font-size:.88rem;cursor:pointer;color:var(--ink2);font-family:inherit;
       transition:all .16s;white-space:nowrap}
  .tab:hover{border-color:#CFC9B9}
  .tab.active{background:var(--green);border-color:var(--green);color:#fff}

  /* ---------- kpi ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem;margin-bottom:1rem}
  .kpi{background:var(--card);border-radius:var(--radius);padding:1.15rem 1.25rem;
       box-shadow:var(--shadow);min-width:0}
  .kpi.dark{background:var(--green);color:#fff;box-shadow:none}
  .kpi .label{font-size:.74rem;color:var(--ink3);margin-bottom:.5rem}
  .kpi.dark .label{color:#B7C9BE}
  .kpi .value{font-size:1.72rem;font-weight:700;font-variant-numeric:tabular-nums;
              letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
  .kpi .foot{font-size:.7rem;color:var(--ink3);margin-top:.5rem}
  .kpi.dark .foot{color:#B7C9BE}

  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:1rem;align-items:start}
  .card{background:var(--card);border-radius:var(--radius);padding:1.3rem 1.4rem;box-shadow:var(--shadow)}
  .card.control{background:var(--green-soft);box-shadow:none}
  .eyebrow{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:.3rem}
  .card h2{font-size:1.12rem;margin:0 0 .95rem;font-family:"Songti SC",Georgia,serif}

  /* ---------- category rows ---------- */
  .catrow{display:grid;grid-template-columns:minmax(0,1fr) 6.6rem 6.4rem;gap:.7rem;align-items:center;
          padding:.62rem 0;border-bottom:1px solid var(--line-soft)}
  .catrow:last-child{border-bottom:none}
  .catname{font-size:.86rem;font-weight:600;display:flex;justify-content:space-between;gap:.5rem}
  .catname .pct{font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;font-size:.76rem}
  .bar{height:.42rem;background:#EDEAE1;border-radius:99px;overflow:hidden;margin-top:.4rem}
  .bar>i{display:block;height:100%;background:var(--green2);border-radius:99px;transition:width .3s}
  .bar.warn>i{background:var(--orange)}
  .bar.over>i{background:var(--red)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-size:.84rem}
  .num .sub2{font-size:.72rem;color:var(--ink3);margin-top:.15rem}
  .over-txt{color:var(--red);font-weight:600}

  /* ---------- control ---------- */
  .ctrl{border-top:1px solid #D8DFD6;padding:.72rem 0;font-size:.85rem;color:#31392F;display:flex;gap:.5rem}
  .ctrl:first-of-type{border-top:none;padding-top:0}
  .ctrl b{font-variant-numeric:tabular-nums}
  .ctrlnum{color:var(--ink3);flex:0 0 auto;font-size:.8rem;padding-top:.05rem}
  .note{margin-top:.9rem;background:var(--orange-soft);border-radius:var(--radius-sm);
        padding:.85rem 1rem;font-size:.78rem;color:#7A4326;line-height:1.7}

  /* ---------- toolbar / tables ---------- */
  .toolbar{display:flex;gap:.55rem;align-items:center;margin:0 0 1rem;flex-wrap:wrap}
  .toolbar input[type=search],.toolbar input[type=text]{flex:1 1 15rem;min-width:11rem;
     border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:.6rem .85rem;
     font-size:.86rem;font-family:inherit;outline:none}
  .toolbar input:focus{border-color:#C9C3B2}
  select{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:.6rem .7rem;
         font-size:.86rem;font-family:inherit;outline:none;cursor:pointer;max-width:11rem}
  .btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:.6rem .95rem;
       font-size:.86rem;cursor:pointer;font-family:inherit;transition:all .16s;white-space:nowrap;color:var(--ink)}
  .btn:hover{border-color:#C9C3B2}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.primary:hover{background:var(--green2)}
  .btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.mini{padding:.3rem .65rem;font-size:.76rem;border-radius:.6rem}
  .btn.danger{color:var(--red);border-color:#EBD9D2}
  .tablecard{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{font-size:.72rem;font-weight:500;color:var(--ink3);text-align:left;padding:.85rem 1rem;
     border-bottom:1px solid var(--line);background:#FCFBF8;white-space:nowrap}
  td{padding:.85rem 1rem;border-bottom:1px solid var(--line-soft);font-size:.86rem;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .b{font-weight:600}
  .sub-cell{font-size:.72rem;color:var(--ink3);margin-top:.12rem}
  .empty{padding:2.6rem 1rem;text-align:center;color:var(--ink3);font-size:.85rem}
  tfoot td{border-top:1px solid var(--line);font-weight:600;background:#FCFBF8}
  .tag{display:inline-block;font-size:.7rem;padding:.14rem .55rem;border-radius:99px;
       background:#EFF2ED;color:var(--green2);white-space:nowrap}
  .tag.over{background:var(--orange-soft);color:var(--red)}
  .tag.warn{background:#FCF3E3;color:var(--amber)}
  .hint{font-size:.74rem;color:var(--ink3);line-height:1.7}

  /* ---------- fab ---------- */
  .fab{display:none}
  .hide-desktop{display:none}

  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(30,32,26,.45);display:none;align-items:center;
        justify-content:center;padding:1.2rem;z-index:50;backdrop-filter:blur(2px)}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:1.4rem;width:100%;max-width:34rem;max-height:90vh;overflow:auto;
         padding:1.5rem 1.6rem}
  .modal h3{margin:0 0 .2rem;font-size:1.25rem;font-family:"Songti SC",Georgia,serif}
  .modal .ms{color:var(--ink3);font-size:.76rem;margin-bottom:1.1rem}
  .field{margin-bottom:.85rem}
  .field label{display:block;font-size:.74rem;font-weight:600;color:var(--ink2);margin-bottom:.35rem}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:.75rem;
     padding:.65rem .85rem;font-size:.9rem;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2)}
  .field input.big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;padding:.55rem .85rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.4rem .8rem;
     font-size:.78rem;font-family:inherit;cursor:pointer;color:var(--ink2)}
  .chips button.on{background:var(--green);border-color:var(--green);color:#fff}
  .actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
  .wan{font-size:.72rem;color:var(--ink3);margin-top:.25rem}
  .steps{font-size:.78rem;color:var(--ink2);line-height:1.85}
  .steps b{color:var(--ink)}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .wrap{padding:1.3rem .9rem 5.5rem}
    h1{font-size:1.85rem}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
    .kpi{padding:.9rem 1rem;border-radius:var(--radius-sm)}
    .kpi .value{font-size:1.38rem}
    .kpi .label{font-size:.7rem;margin-bottom:.35rem}
    .grid2{grid-template-columns:1fr}
    .card{padding:1.05rem 1rem;border-radius:var(--radius-sm)}
    .catrow{grid-template-columns:minmax(0,1fr) 5.6rem;gap:.5rem}
    .catrow .col-hide{display:none}
    th.hide-s,td.hide-s{display:none}
    .toolbar input[type=search]{flex:1 1 100%}
    select{max-width:none;flex:1}
    .fab{display:flex;position:fixed;right:1.1rem;bottom:calc(1.1rem + env(safe-area-inset-bottom));
      width:3.5rem;height:3.5rem;border-radius:50%;background:var(--orange);color:#fff;border:none;
      font-size:1.7rem;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(207,107,63,.42);
      z-index:40;cursor:pointer;line-height:1}
    .hide-desktop{display:inline-block}
    .fs button{padding:.3rem .45rem}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr}
    .row2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-row">
      <div>
        <h1 id="title">装修预算账本</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="top-actions">
        <div class="fs" id="fsCtrl" title="字号">
          <button data-fs="15">小</button><button data-fs="16.5">标准</button>
          <button data-fs="18">大</button><button data-fs="20">特大</button>
        </div>
        <button class="pill" id="baselineBtn">预算基线 · <b id="baselineText"></b></button>
        <button class="btn orange hide-desktop" id="topAdd">＋ 记一笔</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="overview">预算总览</button>
    <button class="tab" data-view="items">预算明细</button>
    <button class="tab" data-view="payments">付款记录</button>
    <button class="tab" data-view="settings">设置</button>
  </div>

  <section id="view-overview"></section>
  <section id="view-items" hidden></section>
  <section id="view-payments" hidden></section>
  <section id="view-settings" hidden></section>
</div>

<button class="fab" id="fab" title="记一笔">＋</button>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<input type="file" id="fileInput" accept="application/json,text/html" hidden>

<script src="./qrcode-lib.js"></script>
<script>
const SEED = {"meta":{"title":"装修预算账本","subtitle":"硬装、设备、柜体与付款，都记在一个地方。","area":"","baseline":0,"source":""},"fontSize":16.5,"categories":[{"name":"设计测量","budget":0,"note":"设计费、量房、出图"},{"name":"施工半包款","budget":0,"note":"付给工长 / 装修公司的施工款"},{"name":"拆除与清运","budget":0,"note":"砸墙、拆保温、垃圾清运"},{"name":"水电改造","budget":0,"note":"改水、改电、开关插座、网线"},{"name":"防水与美缝","budget":0,"note":"防水、闭水试验、美缝"},{"name":"木工吊顶","budget":0,"note":"吊顶、背景墙基层、烟道"},{"name":"墙面油漆","budget":0,"note":"墙固、腻子、乳胶漆、艺术漆"},{"name":"瓷砖地板","budget":0,"note":"瓷砖、木地板、过门石、窗台石"},{"name":"门窗","budget":0,"note":"入户门、室内门、封阳台、纱窗"},{"name":"全屋定制","budget":0,"note":"橱柜、衣柜、鞋柜、木作"},{"name":"厨卫设备","budget":0,"note":"马桶、花洒、浴室柜、水槽、地漏"},{"name":"家电","budget":0,"note":"冰箱、洗衣机、烟灶、洗碗机、电视"},{"name":"空调地暖","budget":0,"note":"中央空调、地暖、新风"},{"name":"净水软水","budget":0,"note":"前置过滤器、净水器、软水机"},{"name":"智能家居","budget":0,"note":"智能开关、灯带、传感器、网关、电动窗帘"},{"name":"灯具","budget":0,"note":"主灯、筒灯射灯、轨道灯"},{"name":"家具软装","budget":0,"note":"沙发、餐桌、床、床垫、窗帘"},{"name":"其他杂项","budget":0,"note":"说不清的先放这儿"},{"name":"风险预备金","budget":0,"note":"留着应急，尽量别提前动"}],"items":[],"payments":[]};
const STORE_KEY = 'zhuangxiu-ledger-v2';
const STAGES = ['定金','阶段款','中期款','尾款','增项','全款'];
const PRIORITIES = ['必须','重要','可选'];
const FONT_SIZES = [15, 16.5, 18, 20];

let state = load();
let view = 'overview';
let itemFilter = { kw:'', category:'全部', priority:'全部' };
let payFilter = { kw:'', category:'全部' };
let canPersist = true;
const isFile = location.protocol === 'file:';

/* ---------- storage ---------- */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.items && d.payments) return normalize(d); }
  }catch(e){ canPersist = false; console.warn('本地存储不可用', e); }
  return normalize(structuredClone(SEED));
}
function normalize(d){
  d.payments = (d.payments||[]).map((p,i)=>({ id:p.id ?? ('p'+(i+1)), ...p }));
  d.items = (d.items||[]).map((it,i)=>({ id:it.id ?? ('i'+(i+1)), ...it }));
  d.categories = d.categories||[];
  d.meta = d.meta||{};
  if(!d.fontSize) d.fontSize = 16.5;
  return d;
}
function save(){
  if(!canPersist) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ canPersist = false; render(); }
}
function banner(){
  if(canPersist) return '';
  return `<div class="note" style="margin:0 0 .9rem">这个浏览器环境不让本地保存（localStorage），
    现在的改动只存在内存里，刷新就没了。换成 Chrome / Safari 打开同一个地址就正常。</div>`;
}

/* ---------- helpers ---------- */
const yuan = n => '¥' + Math.round(n||0).toLocaleString('zh-CN');
const wan = n => ((n||0)/10000).toFixed(1).replace(/\.0$/,'') + ' 万';
const pctv = (a,b) => b>0 ? (a/b*100) : 0;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paidOfCategory = name => state.payments.filter(p=>p.category===name).reduce((s,p)=>s+ +p.amount,0);
const paidOfItem = it => state.payments.filter(p=>p.category===it.category && p.item===it.name).reduce((s,p)=>s+ +p.amount,0);
const totalPaid = () => state.payments.reduce((s,p)=>s+ +p.amount,0);
const totalBudget = () => state.categories.reduce((s,c)=>s+ +c.budget,0);
const contractSum = () => state.items.reduce((s,i)=>s+ +(i.contract||0),0);
const barCls = r => r>100 ? 'over' : (r>=90 && r<99.95) ? 'warn' : '';

/* ---------- render ---------- */
function render(){
  document.documentElement.style.fontSize = (state.fontSize||16.5) + 'px';
  document.getElementById('title').textContent = state.meta.title;
  document.getElementById('subtitle').textContent = state.meta.subtitle;
  document.getElementById('baselineText').textContent = yuan(state.meta.baseline);
  document.querySelectorAll('#fsCtrl button').forEach(b=>
    b.classList.toggle('on', Math.abs(+b.dataset.fs - (state.fontSize||16.5)) < .1));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  ['overview','items','payments','settings'].forEach(v=>{
    document.getElementById('view-'+v).hidden = (v!==view);
  });
  if(view==='overview') renderOverview();
  if(view==='items') renderItems();
  if(view==='payments') renderPayments();
  if(view==='settings') renderSettings();
}

function renderOverview(){
  const paid = totalPaid(), budget = totalBudget(), base = +state.meta.baseline;
  const left = budget - paid, progress = pctv(paid, budget);
  const rows = state.categories.map(c=>{
    const p = paidOfCategory(c.name), r = pctv(p, c.budget);
    const over = p > c.budget;
    return `<div class="catrow">
      <div>
        <div class="catname"><span>${esc(c.name)}</span>
          <span class="pct">${over? `<span class="over-txt">超 ${yuan(p-c.budget)}</span>` : r.toFixed(0)+'%'}</span></div>
        <div class="bar ${barCls(r)}"><i style="width:${Math.min(r,100).toFixed(1)}%"></i></div>
      </div>
      <div class="num" title="${esc(c.note||'')}">${yuan(c.budget)}<div class="sub2">预算</div></div>
      <div class="num col-hide">${yuan(p)}<div class="sub2">已付</div></div>
    </div>`;
  }).join('');
  const ctrl = controlPoints(paid, budget);
  document.getElementById('view-overview').innerHTML = `
    ${banner()}
    <div class="kpis">
      <div class="kpi dark">
        <div class="label">总预算</div>
        <div class="value">${yuan(budget)}</div>
        <div class="foot">预算基线 ${yuan(base)}${base!==budget?` · 差 ${yuan(budget-base)}`:''}</div>
      </div>
      <div class="kpi">
        <div class="label">已经花了</div>
        <div class="value">${yuan(paid)}</div>
        <div class="foot">占总预算 ${progress.toFixed(1)}% · ${state.payments.length} 笔</div>
      </div>
      <div class="kpi">
        <div class="label">已签合同</div>
        <div class="value">${yuan(contractSum())}</div>
        <div class="foot">已补录合同价的项目</div>
      </div>
      <div class="kpi">
        <div class="label">还能花</div>
        <div class="value">${yuan(left)}</div>
        <div class="foot">总预算 − 已经花了</div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="eyebrow">Allocation</div>
        <h2>每项预算花了多少</h2>
        ${rows}
      </div>
      <div class="card control">
        <div class="eyebrow">Control</div>
        <h2>现在要注意</h2>
        ${ctrl.list}
        <div class="note">${ctrl.note}</div>
      </div>
    </div>`;
}

function controlPoints(paid, budget){
  const over = state.categories
    .map(c=>({name:c.name, over: paidOfCategory(c.name)-c.budget}))
    .filter(x=>x.over>0).sort((a,b)=>b.over-a.over);
  const settled = it => {
    const ps = state.payments.filter(p=>p.category===it.category && p.item===it.name);
    return ps.length>0 && ps.every(p=>p.stage==='全款');
  };
  const noContract = state.items
    .filter(i=> !(+i.contract) && paidOfItem(i)>0 && !settled(i))
    .map(i=>({...i, p: paidOfItem(i)})).sort((a,b)=>b.p-a.p);
  const idle = state.categories
    .filter(c=> paidOfCategory(c.name)===0 && +c.budget>0)
    .map(c=>({name:c.name, budget:+c.budget}));
  const committed = state.items.filter(i=>+i.contract>0 && paidOfItem(i) < +i.contract)
    .map(i=>({...i, rest:+i.contract-paidOfItem(i)})).sort((a,b)=>b.rest-a.rest);

  const lines = [];
  lines.push(`<div class="ctrl"><span class="ctrlnum">1</span><span>${
    over.length ? over.slice(0,3).map(x=>`<b>${esc(x.name)}</b> 超了 <b>${yuan(x.over)}</b>`).join('；')
                : '目前没有哪一项花超'
  }</span></div>`);
  lines.push(`<div class="ctrl"><span class="ctrlnum">2</span><span>${
    noContract.length
      ? `有 <b>${noContract.length}</b> 个项目只付了定金、还没填合同总价（已付 ${yuan(noContract.reduce((s,i)=>s+i.p,0))}）`
      : '该填的合同价都填了'
  }</span></div>`);
  lines.push(`<div class="ctrl"><span class="ctrlnum">3</span><span>${
    idle.length ? `${idle.map(x=>`<b>${esc(x.name)}</b>`).join('、')} 还没开始花钱` : '所有项目都已经启动'
  }</span></div>`);

  const worst = over[0], next = noContract[0], lock = committed[0];
  let note = worst ? `超支在 ${worst.name}（+${yuan(worst.over)}）。` : '目前没有超支。';
  if(next) note += `先把「${next.name}」的合同总价补上（已付 ${yuan(next.p)}），剩余预算才算得准。`;
  if(lock) note += `「${lock.name}」还有 ${yuan(lock.rest)} 没付，下单前先看这里。`;
  if(idle.length) note += ` ${idle.map(x=>x.name).join('、')} 这块预算还没动。`;
  return { list: lines.join(''), note: esc(note) };
}

async function initMobileCard(){
  const input = document.getElementById('mobileUrl');
  if(!input) return;
  let url = state.meta.mobileUrl || '';
  try{
    const r = await fetch('./lan-url.txt', {cache:'no-store'});
    if(r.ok){ const t = (await r.text()).trim(); if(t) url = t; }
  }catch(e){}
  if(!url) url = location.origin + location.pathname;
  input.value = url;
  if(location.hostname==='127.0.0.1' || location.hostname==='localhost'){
    document.getElementById('ipHint').innerHTML =
      '<span style="color:var(--orange)">把上面这个地址发到手机上打开，再按下面的方法加到主屏幕。</span>';
  }
  const draw = () => {
    const box = document.getElementById('qrBox');
    try{
      const qr = qrcode(0,'M'); qr.addData(input.value.trim()); qr.make();
      box.innerHTML = qr.createSvgTag({cellSize:6, margin:4, scalable:true});
      const svg = box.querySelector('svg');
      if(svg){ svg.setAttribute('width','196'); svg.setAttribute('height','196'); svg.style.display='block'; }
    }catch(e){ box.innerHTML = '<div class="hint">地址太长</div>'; }
  };
  draw();
  input.oninput = draw;
  input.onchange = () => { state.meta.mobileUrl = input.value.trim(); save(); };
  document.getElementById('regenQr').onclick = () => { state.meta.mobileUrl = input.value.trim(); save(); draw(); };
  document.getElementById('copyUrl').onclick = async () => {
    try{ await navigator.clipboard.writeText(input.value.trim()); alert('已复制：'+input.value.trim()); }
    catch(e){ input.select(); }
  };
}

    <div class="field"><label>副标题</label><input id="fSub" value="${esc(state.meta.subtitle)}"></div>
    <div class="actions"><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave">保存</button></div>`;
  const b = document.getElementById('fBase');
  const sync = () => document.getElementById('wBase').textContent = (+b.value||0) ? wan(+b.value) : '';
  b.oninput = sync; sync();
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = () => {
    state.meta.baseline = +b.value||0;
    state.meta.subtitle = document.getElementById('fSub').value;
    save(); closeModal(); render();
  };
  mask.classList.add('show');
}

/* ---------- export / import ---------- */
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type: type+';charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
const csvCell = v => { const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
function exportCSV(kind){
  let rows;
  if(kind==='items'){
    rows = [['分类','区域','项目','优先级','预算','合同','已付','进度']];
    state.items.forEach(i=>{
      const p = paidOfItem(i), b = +i.budget||0;
      rows.push([i.category,i.area,i.name,i.priority,b,i.contract,p,(b?(p/b*100).toFixed(1):'0')+'%']);
    });
  }else{
    rows = [['日期','分类','项目','阶段','金额','备注']];
    state.payments.forEach(p=>rows.push([p.date,p.category,p.item,p.stage,p.amount,p.note||'']));
  }
  download(kind==='items'?'预算明细.csv':'付款记录.csv',
    '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
async function exportOffline(){
  try{
    const src = await (await fetch(location.pathname, {cache:'no-store'})).text();
    let lib = '';
    try{ lib = await (await fetch('./qrcode-lib.js', {cache:'force-cache'})).text(); }catch(e){}
    let out = src.replace(/const SEED = [\s\S]*?;\n/, 'const SEED = ' + JSON.stringify(state) + ';\n');
    if(lib) out = out.replace('<script src="./qrcode-lib.js"><\/script>', '<script>' + lib + '<\/script>');
    out = out.replace(/<link rel="manifest"[^>]*>\s*/, '')
             .replace(/<link rel="apple-touch-icon"[^>]*>\s*/, '')
             .replace(/<link rel="icon"[^>]*>\s*/, '');
    download('装修账本-离线版.html', out, 'text/html');
  }catch(e){
    alert('导出失败：'+e.message+'\n（这个功能要在 http 打开的页面上用，不能用本地文件打开）');
  }
}
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d.items || !d.payments) throw new Error('文件格式不对');
      state = normalize(d); save(); render(); alert('导入成功');
    }catch(err){ alert('导入失败：'+err.message); }
  };
  reader.readAsText(f); e.target.value = '';
};

/* ---------- bind ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick = () => { view = t.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'}); });
document.querySelectorAll('#fsCtrl button').forEach(b=>b.onclick = () => {
  state.fontSize = +b.dataset.fs; save(); render();
});
document.getElementById('baselineBtn').onclick = baselineModal;
document.getElementById('fab').onclick = () => paymentModal();
document.getElementById('topAdd').onclick = () => paymentModal();
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
render();
</script>
